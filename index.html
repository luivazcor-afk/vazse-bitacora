<html lang="es">

<style>
  :root{--bg:#F4F6F9;--card:#fff;--txt:#1B2430;--sub:#5B6675;--brand:#185FA5;--brand2:#EBF3FC;--borde:#D9DEE5}
  @media (prefers-color-scheme: dark){:root{--bg:#11161D;--card:#1A212B;--txt:#E6EAF0;--sub:#9AA5B4;--brand:#5B9BE0;--brand2:#1E2C3D;--borde:#2B3542}}

  a.prim{background:var(--brand);color:#fff}
  a.sec{background:var(--brand2);color:var(--brand);border:1px solid var(--borde)}
