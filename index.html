<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="https://luivazcor-afk.github.io/vazse-bitacora/logo_R_resolucion.png">
<title>Resumen VAZSE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F5F6F8;--surface:#fff;--surface2:#F7F8FA;
  --bd:#E7E9ED;--bd2:#ECEDF0;--bd3:#E2E4E8;--div:#F0F1F4;--track:#EEF0F3;
  --t1:#161A1F;--t2:#3A4049;--t3:#767E8A;--t4:#8A909A;--t5:#A8AEB6;
  --brand:#235A97;--brand2:#3F73A8;--brand3:#5C8CBE;--brand4:#7FA8CF;
  --brandsoft:#EAF1F8;--brandsofttx:#235A97;--brandhov:#1E4F86;--railhov:#F2F4F6;
  --pos:#1C875A;--neg:#C0453B;--warn:#B5810E;
  --negbg:#FBEAE8;--negbd:#F2D9D6;--warnbg:#FBF2DD;--costbar:#C9D6E4;
}
html[data-theme=dark]{
  --bg:#15171B;--surface:#1E2127;--surface2:#24272E;
  --bd:#2C3038;--bd2:#2C3038;--bd3:#343842;--div:#262932;--track:#2A2E36;
  --t1:#E8E9EC;--t2:#C2C6CD;--t3:#9AA0A9;--t4:#868C95;--t5:#6B7079;
  --brand:#4D8BD1;--brand2:#3F73A8;--brand3:#5C8CBE;--brand4:#6E97C4;
  --brandsoft:#233447;--brandsofttx:#7FB2EA;--brandhov:#5C97D8;--railhov:#262A31;
  --pos:#45B889;--neg:#E8857B;--warn:#D9A93A;
  --negbg:#36211F;--negbd:#4A2B28;--warnbg:#352E1C;--costbar:#3A4250;
}
body{font-family:'IBM Plex Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased;color:var(--t1);background:var(--bg);opacity:1;animation:pageIn .34s cubic-bezier(.22,.61,.36,1)}
body.page-leaving{opacity:0 !important;transform:translateY(-8px);transition:opacity .26s ease,transform .26s ease;animation:none}
@keyframes pageIn{from{transform:translateY(12px)}to{transform:translateY(0)}}
/* vuelo del águila en el login */
@keyframes aguilaVuelo{
  0%{transform:translateY(0) rotate(0deg) scale(1)}
  25%{transform:translateY(-7px) rotate(-1.4deg) scale(1.025)}
  50%{transform:translateY(-10px) rotate(0deg) scale(1.04)}
  75%{transform:translateY(-7px) rotate(1.4deg) scale(1.025)}
  100%{transform:translateY(0) rotate(0deg) scale(1)}
}
@keyframes aguilaEntra{
  0%{transform:translateY(26px) scale(.82)}
  100%{transform:translateY(0) scale(1)}
}
.aguila-anim{
  animation:aguilaEntra .7s cubic-bezier(.22,.61,.36,1) both, aguilaVuelo 3.6s ease-in-out .7s infinite;
  transform-origin:50% 70%;
  filter:drop-shadow(0 8px 14px rgba(0,0,0,.28));
  will-change:transform
}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
a{color:inherit}
/* hover affordances (inline base styles win on specificity, so these need !important) */
.rail-item:hover{background:var(--railhov) !important}
.seg-tag:hover{border-color:var(--brand) !important;color:var(--brandsofttx) !important}
.nav-tab:hover{color:var(--t1) !important}
.theme-btn:hover{border-color:var(--brand) !important;color:var(--brandsofttx) !important}
.sync-btn:hover{border-color:var(--brand) !important}
.export-btn:hover{background:var(--brandhov) !important}
.logout-btn:hover{border-color:var(--neg) !important;background:var(--negbg) !important}
.login-btn:hover{background:var(--brandhov) !important}
</style>
</head>
<body>

<div id="login-screen"></div>
<div id="app-root"></div>

<script>
// ── Helpers ───────────────────────────────────────────
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function money(n){ return '$' + Math.round(n||0).toLocaleString('en-US'); }
function moneyK(n){ n=n||0; const a=Math.abs(n); if(a>=1000) return '$'+(Math.round(n/100)/10)+'k'; return '$'+Math.round(n); }
function num(v){ const x=parseFloat(v); return isNaN(x)?0:x; }
function isPagada(c){ const e=(c.estado||'').toLowerCase(); return e==='pagado'||e==='pagada'||e==='cobrada'||e==='cobrado'; }
function isCancel(c){ const e=(c.estado||'').toLowerCase(); return e==='cancelada'||e==='cancelado'; }
function parseFecha(s){ if(!s) return null; const d=new Date(String(s).length<=10? s+'T00:00:00': s); return isNaN(d.getTime())?null:d; }
function mesEs(d){ const m=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre']; const s=m[d.getMonth()]; return s.charAt(0).toUpperCase()+s.slice(1)+' '+d.getFullYear(); }
function mesCorto(k){ const m=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic']; const p=k.split('-'); return m[parseInt(p[1])-1]; }

// ── Estado ────────────────────────────────────────────
const state = {
  theme: 'light',
  periodo: 'mes',
  authed: (() => { try { return !!localStorage.getItem('vazse_auth'); } catch(e){ return false; } })(),
  loginErr: false,
};

// ── Auth (compartido con la bitácora vía localStorage 'vazse_auth') ──
function checkAuth(){
  let auth = null;
  try { auth = localStorage.getItem('vazse_auth'); } catch(e){}
  state.authed = !!auth;
  render();
}
function hacerLogin(){
  const lu = document.getElementById('login-user');
  const lp = document.getElementById('login-pass');
  const u = (lu && lu.value || '').trim().toLowerCase();
  const p = (lp && lp.value || '');
  if (u === 'vazse' && p === 'vazse2024') {
    try { localStorage.setItem('vazse_auth', btoa(u + ':' + Date.now())); } catch(e){}
    state.authed = true; state.loginErr = false;
  } else {
    if (lp) lp.value = '';
    state.loginErr = true;
  }
  render();
}
function cerrarSesion(){
  try { localStorage.removeItem('vazse_auth'); } catch(e){}
  state.authed = false; state.loginErr = false;
  render();
}

function periodRange(){
  const hoy = new Date(); hoy.setHours(0,0,0,0);
  const p = state.periodo || 'mes';
  let from, to;
  if(p==='hoy'){ from = new Date(hoy); to = new Date(hoy); to.setDate(to.getDate()+1); }
  else if(p==='semana'){ const dow=(hoy.getDay()+6)%7; from=new Date(hoy); from.setDate(from.getDate()-dow); to=new Date(from); to.setDate(to.getDate()+7); }
  else if(p==='trim'){ const q=Math.floor(hoy.getMonth()/3); from=new Date(hoy.getFullYear(), q*3, 1); to=new Date(hoy.getFullYear(), q*3+3, 1); }
  else { from=new Date(hoy.getFullYear(), hoy.getMonth(), 1); to=new Date(hoy.getFullYear(), hoy.getMonth()+1, 1); }
  return { from, to, p };
}
function periodLabel(){
  const p = state.periodo || 'mes';
  if(p==='hoy') return 'Hoy';
  if(p==='semana') return 'Esta semana';
  if(p==='trim') return 'Este trimestre';
  return null; // mes -> usa nombre del mes
}

function applyTheme(theme){
  document.documentElement.setAttribute('data-theme', theme);
  try { localStorage.setItem('vazse_theme', theme); } catch(e){}
  state.theme = theme;
  render();
}

function readCache(){
  try{
    const raw = localStorage.getItem('vazse_cache_datos');
    if(!raw) return null;
    const o = JSON.parse(raw);
    const d = o.data || o;
    if(!d) return null;
    const registros = d.registros || d.viajes || [];
    const cobranzas = d.cobranzas || [];
    const pagos = d.pagos || [];
    if(!registros.length && !cobranzas.length && !pagos.length) return null;
    return { registros, cobranzas, pagos, ts: o.ts || null };
  }catch(e){ return null; }
}

function exportarXLSX(){
  if(typeof XLSX==='undefined'){ alert('La librería de exportación aún se está cargando, intenta de nuevo en un momento.'); return; }
  const cache = readCache();
  const rng = periodRange();
  const inR = (s)=>{ const d=parseFecha(s); return d && d>=rng.from && d<rng.to; };
  const reg = (cache?cache.registros:[]).filter(r=>inR(r.fecha));
  const cob = (cache?cache.cobranzas:[]).filter(r=>inR(r.fechaEmision));
  const pag = (cache?cache.pagos:[]).filter(r=>inR(r.fecha));

  const wb = XLSX.utils.book_new();

  const ingresos = reg.reduce((s,v)=>s+num(v.cobrado),0);
  const costo = reg.reduce((s,v)=>s+num(v.costo),0);
  const resumen = [
    ['Resumen ejecutivo VAZSE'],
    ['Periodo', periodLabel() || 'Este mes'],
    ['Generado', new Date().toLocaleString('es-MX')],
    [],
    ['Indicador','Valor'],
    ['Viajes registrados', reg.length],
    ['Ingresos (cobrado)', ingresos],
    ['Costo total', costo],
    ['Utilidad neta', ingresos-costo],
    ['Margen %', ingresos>0 ? +((ingresos-costo)/ingresos*100).toFixed(1) : 0],
    ['Registros de cobranza', cob.length],
    ['Pagos a proveedores', pag.length],
  ];
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(resumen), 'Resumen');

  const sheetFrom = (rows, headers)=>{
    if(!rows.length) return XLSX.utils.aoa_to_sheet([headers.length?headers:['Sin datos']]);
    return XLSX.utils.json_to_sheet(rows);
  };
  if(reg.length) XLSX.utils.book_append_sheet(wb, sheetFrom(reg,[]), 'Viajes');
  if(cob.length) XLSX.utils.book_append_sheet(wb, sheetFrom(cob,[]), 'Cobranza');
  if(pag.length) XLSX.utils.book_append_sheet(wb, sheetFrom(pag,[]), 'Pagos');

  const hoy = new Date();
  const stamp = hoy.getFullYear()+String(hoy.getMonth()+1).padStart(2,'0')+String(hoy.getDate()).padStart(2,'0');
  XLSX.writeFile(wb, 'Resumen_VAZSE_'+stamp+'.xlsx');
}

function buildModel(){
  const cache = readCache();
  if(cache) return modelFromData(cache);
  return demoModel();
}

function modelFromData(cache){
  const rng = periodRange();
  const inR = (s)=>{ const d=parseFecha(s); return d && d>=rng.from && d<rng.to; };
  const V = cache.registros.map(r=>({ ...r, costo:num(r.costo), cobrado:num(r.cobrado) })).filter(r=>inR(r.fecha));
  const C = cache.cobranzas.map(r=>({ ...r, monto:num(r.monto) })).filter(r=>inR(r.fechaEmision));
  const P = cache.pagos.map(r=>({ ...r, monto:num(r.monto) })).filter(r=>inR(r.fecha));
  const hoy = new Date(); hoy.setHours(0,0,0,0);
  const DAY = 86400000;

  const ingresos = V.reduce((s,v)=>s+v.cobrado,0);
  const costo = V.reduce((s,v)=>s+v.costo,0);
  const util = ingresos - costo;
  const margen = ingresos>0 ? (util/ingresos*100) : 0;

  const vencidas = C.filter(c=>{ if(isPagada(c)||isCancel(c)) return false; const fv=parseFecha(c.fechaVencimiento); return fv && fv<hoy; });
  const carteraVencida = vencidas.reduce((s,c)=>s+c.monto,0);

  const pendientesP = P.filter(p=>!isPagada(p));
  const porPagar = pendientesP.reduce((s,p)=>s+p.monto,0);
  const porPagarVencido = pendientesP.filter(p=>{ const fv=parseFecha(p.fechaVencimiento); return fv && fv<hoy; }).reduce((s,p)=>s+p.monto,0);

  const enRuta = V.filter(v=>{ const e=(v.estadoFlete||'').toLowerCase(); return e==='libre'||e==='en_patio'||e==='en_proceso'; }).length;
  const facturados = C.length;
  const cobrados = C.filter(c=>isPagada(c)).length;
  const porCobrar = C.filter(c=>!isPagada(c)&&!isCancel(c)).length;
  const funnelRaw = [
    {label:'Registrados', n:V.length, cv:'--brand'},
    {label:'Facturados', n:facturados, cv:'--brand2'},
    {label:'Cobrados', n:cobrados, cv:'--pos'},
    {label:'Por cobrar', n:porCobrar, cv:'--warn'},
    {label:'En ruta', n:enRuta, cv:'--brand3'},
  ];

  let cobBase = vencidas.slice();
  if(!cobBase.length) cobBase = C.filter(c=>!isPagada(c)&&!isCancel(c));
  const cobrRaw = cobBase.map(c=>{
    const fv=parseFecha(c.fechaVencimiento);
    const dias = fv? Math.round((hoy-fv)/DAY) : 0;
    return { cliente:c.cliente||'Sin cliente', dias, monto:c.monto };
  }).sort((a,b)=>b.monto-a.monto).slice(0,3);

  const pagosRaw = pendientesP.map(p=>{
    const fv=parseFecha(p.fechaVencimiento);
    const dias = fv? Math.round((fv-hoy)/DAY) : 999;
    return { prov:p.proveedor||'Sin nombre', concepto:p.concepto||p.tipo||p.categoria||'', dias, monto:p.monto };
  }).sort((a,b)=>a.dias-b.dias).slice(0,3);

  const mezMap={};
  V.forEach(v=>{ const k=(v.servicio||v.tipo||'Otro'); mezMap[k]=(mezMap[k]||0)+1; });
  let mezEntries=Object.entries(mezMap).sort((a,b)=>b[1]-a[1]);
  if(mezEntries.length>4){ const top=mezEntries.slice(0,3); const otros=mezEntries.slice(3).reduce((s,e)=>s+e[1],0); top.push(['Otros',otros]); mezEntries=top; }
  const mezTotal=mezEntries.reduce((s,e)=>s+e[1],0)||1;
  const mezColors=['--brand','--pos','--brand4','--warn'];
  const mezclaRaw=mezEntries.map((e,i)=>({label:e[0], pct:Math.round(e[1]/mezTotal*100), cv:mezColors[i%mezColors.length]}));

  const mMap={};
  V.forEach(v=>{ const d=parseFecha(v.fecha); if(!d) return; const k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); if(!mMap[k]) mMap[k]={ing:0,cost:0}; mMap[k].ing+=v.cobrado; mMap[k].cost+=v.costo; });
  const mKeys=Object.keys(mMap).sort().slice(-6);
  const trendRaw=mKeys.map(k=>({mes:mesCorto(k), ing:mMap[k].ing, cost:mMap[k].cost}));

  const rMap={};
  V.forEach(v=>{ const k=v.cliente||'(sin cliente)'; if(!rMap[k]) rMap[k]={cob:0,cos:0}; rMap[k].cob+=v.cobrado; rMap[k].cos+=v.costo; });
  const rentRaw=Object.entries(rMap).map(([k,o])=>({cliente:k, cobrado:o.cob, margen:o.cob>0?((o.cob-o.cos)/o.cob*100):0})).sort((a,b)=>b.cobrado-a.cobrado).slice(0,5);

  let deltaTxt='', deltaColor='var(--t4)';
  if(trendRaw.length>=2){
    const last=trendRaw[trendRaw.length-1], prev=trendRaw[trendRaw.length-2];
    const uL=last.ing-last.cost, uP=prev.ing-prev.cost;
    if(Math.abs(uP)>0){ const d=(uL-uP)/Math.abs(uP)*100; deltaTxt=(d>=0?'▲ ':'▼ ')+Math.abs(d).toFixed(1)+'% vs '+prev.mes; deltaColor=d>=0?'var(--pos)':'var(--neg)'; }
  }

  const pLabel = periodLabel();
  let monthLabel='';
  if(mKeys.length){ const lk=mKeys[mKeys.length-1].split('-'); monthLabel=mesEs(new Date(parseInt(lk[0]),parseInt(lk[1])-1,1)); }
  const periodoTxt = pLabel || monthLabel;
  const tsTxt = cache.ts ? new Date(cache.ts).toLocaleString('es-MX',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}) : '';

  return {
    isDemo:false,
    headTitle: periodoTxt ? ('¿Cómo vamos? · '+periodoTxt) : '¿Cómo vamos?',
    headSub: 'Bitácora VAZSE · '+V.length+' viajes'+(tsTxt?(' · actualizado '+tsTxt):''),
    k:{
      utilFmt:money(util), deltaTxt, deltaColor,
      margenTxt:margen.toFixed(1)+'%', margenW:Math.max(2,Math.min(100,margen/30*100)).toFixed(0)+'%',
      carteraFmt:money(carteraVencida), carteraSub:vencidas.length+' factura'+(vencidas.length===1?'':'s')+' vencida'+(vencidas.length===1?'':'s'),
      porPagarFmt:money(porPagar), porPagarSub:money(porPagarVencido)+' vencido',
    },
    funnelRaw, cobrRaw, pagosRaw, mezclaRaw, mezTotal, trendRaw, rentRaw,
  };
}

function demoModel(){
  return {
    isDemo:true,
    headTitle:'¿Cómo vamos? · Mayo 2026',
    headSub:'Datos de ejemplo · abre una pestaña y sincroniza para ver los reales',
    k:{
      utilFmt:'$284,500', deltaTxt:'▲ 12.4% vs Abr', deltaColor:'var(--pos)',
      margenTxt:'23.4%', margenW:'78%',
      carteraFmt:'$186,300', carteraSub:'3 facturas vencidas',
      porPagarFmt:'$98,400', porPagarSub:'$41,200 vencido',
    },
    funnelRaw:[
      {label:'Registrados',n:142,cv:'--brand'},
      {label:'Facturados',n:116,cv:'--brand2'},
      {label:'Cobrados',n:98,cv:'--pos'},
      {label:'Por cobrar',n:18,cv:'--warn'},
      {label:'En ruta',n:24,cv:'--brand3'},
    ],
    cobrRaw:[
      {cliente:'Logística Aduanal GH',dias:64,monto:72400},
      {cliente:'Importaciones Lee',dias:41,monto:58900},
      {cliente:'Aceros del Norte',dias:33,monto:33800},
    ],
    pagosRaw:[
      {prov:'Diésel Express',concepto:'combustible',dias:2,monto:38200},
      {prov:'Casetas IAVE',concepto:'',dias:-3,monto:19800},
      {prov:'Talleres MecánicaPro',concepto:'mantto',dias:6,monto:26400},
    ],
    mezclaRaw:[
      {label:'Importación',pct:46,cv:'--brand'},
      {label:'Exportación',pct:27,cv:'--pos'},
      {label:'Nacional',pct:19,cv:'--brand4'},
      {label:'Vacío',pct:8,cv:'--warn'},
    ],
    mezTotal:142,
    trendRaw:[
      {mes:'Dic',ing:880,cost:680},{mes:'Ene',ing:940,cost:730},{mes:'Feb',ing:910,cost:720},
      {mes:'Mar',ing:1000,cost:770},{mes:'Abr',ing:1030,cost:780},{mes:'May',ing:1100,cost:840},
    ],
    rentRaw:[
      {cliente:'Comercializadora del Pacífico',cobrado:342000,margen:28},
      {cliente:'Aceros del Norte',cobrado:268000,margen:24},
      {cliente:'Logística Aduanal GH',cobrado:214000,margen:19},
      {cliente:'Distribuidora Bajío',cobrado:176000,margen:31},
      {cliente:'Importaciones Lee',cobrado:128000,margen:14},
    ],
  };
}

function renderVals(){
  const m = buildModel();

  const maxN = Math.max(1, ...m.funnelRaw.map(f=>f.n));
  const funnel = m.funnelRaw.map(f=>({
    label:f.label, n:f.n,
    barStyle:`width:100%;height:${f.n>0?Math.max(8,Math.round(f.n/maxN*120)):4}px;background:var(${f.cv});border-radius:7px 7px 0 0`
  }));

  const cobr = m.cobrRaw.map(c=>{
    const accion = c.dias>60?'llamar hoy':c.dias>30?'enviar recordatorio':c.dias>0?'seguimiento':'por vencer';
    const col = c.dias>30?'var(--neg)':'var(--warn)';
    return { cliente:c.cliente, sub:(c.dias>0? c.dias+' d · ':'')+accion, subColor:col, dot:col, monto:money(c.monto) };
  });

  const pagosL = m.pagosRaw.map(p=>{
    const venceTxt = p.dias<0? ('vencido '+(-p.dias)+' d') : ('vence en '+p.dias+' d');
    const sub = p.concepto? (p.concepto+' · '+venceTxt) : venceTxt;
    return { prov:p.prov, sub, subColor:p.dias<0?'var(--neg)':'var(--t3)', dot:p.dias<0?'var(--neg)':'var(--warn)', monto:money(p.monto) };
  });

  let acc=0; const segs=[];
  m.mezclaRaw.forEach(x=>{ const a=acc, b=acc+x.pct; segs.push(`var(${x.cv}) ${a}% ${b}%`); acc=b; });
  if(acc<100 && segs.length){ segs.push(`var(--track) ${acc}% 100%`); }
  const mezclaGrad = segs.length? `conic-gradient(${segs.join(',')})` : 'var(--track)';
  const mezcla = m.mezclaRaw.map(x=>({ label:x.label, pct:x.pct+'%', color:`var(${x.cv})`, pctColor:x.cv==='--warn'?'var(--warn)':'var(--t3)' }));

  const maxT = Math.max(1, ...m.trendRaw.map(t=>Math.max(t.ing,t.cost)));
  const trend = m.trendRaw.map((t,i)=>({
    mes:t.mes,
    mesColor:i===m.trendRaw.length-1?'var(--t2)':'var(--t5)',
    mesWeight:i===m.trendRaw.length-1?'600':'400',
    ingStyle:`flex:1;height:${Math.max(2,Math.round(t.ing/maxT*110))}px;background:var(--brand);border-radius:3px 3px 0 0`,
    costStyle:`flex:1;height:${Math.max(2,Math.round(t.cost/maxT*110))}px;background:var(--costbar);border-radius:3px 3px 0 0`
  }));
  const totCost = m.trendRaw.reduce((s,t)=>s+t.cost,0);
  const trendSub = m.isDemo? 'costo/viaje $6.5k' : (m.mezTotal? ('costo/viaje '+moneyK(totCost/Math.max(1,m.mezTotal))) : '');

  const maxCob = Math.max(1, ...m.rentRaw.map(r=>r.cobrado));
  const rent = m.rentRaw.map(r=>({
    cliente:r.cliente,
    montoFmt:moneyK(r.cobrado),
    margenTxt:Math.round(r.margen)+'%'+(r.margen<15?' ⚠':''),
    margenColor:r.margen<15?'var(--neg)':'var(--pos)',
    barStyle:`width:${Math.max(4,Math.round(r.cobrado/maxCob*100))}%;height:100%;background:var(${r.margen<15?'--warn':'--brand'});border-radius:4px`
  }));

  const theme = state.theme;
  const per = state.periodo || 'mes';
  const perStyle = (id)=> id===per
    ? 'font-size:12.5px;font-weight:600;color:var(--brandsofttx);background:var(--brandsoft);padding:8px 11px;border-radius:7px;cursor:pointer'
    : 'font-size:12.5px;color:var(--t3);padding:8px 11px;border-radius:7px;cursor:pointer';
  const periodos = [
    { id:'hoy', label:'Hoy', style:perStyle('hoy') },
    { id:'semana', label:'Esta semana', style:perStyle('semana') },
    { id:'mes', label:'Este mes', style:perStyle('mes') },
    { id:'trim', label:'Trimestre', style:perStyle('trim') },
  ];

  return {
    showLogin: !state.authed,
    loginErr: state.loginErr,
    periodos,
    themeIcon: theme==='dark'?'☀':'☾',
    headTitle:m.headTitle, headSub:m.headSub,
    demoBadge: m.isDemo? 'Ejemplo' : '',
    k:m.k,
    funnel, cobr, pagosL,
    mezclaGrad, mezclaTotal:m.mezTotal, mezcla,
    trend, trendSub, rent,
  };
}

// ── Eventos (delegados, ya que el DOM se reconstruye en cada render) ──
document.addEventListener('click', (e) => {
  const period = e.target.closest('[data-period]');
  if(period){ state.periodo = period.dataset.period; render(); return; }

  const action = e.target.closest('[data-action]');
  if(action){
    const a = action.dataset.action;
    if(a==='login') hacerLogin();
    else if(a==='toggle-theme') applyTheme(state.theme==='dark'?'light':'dark');
    else if(a==='export') exportarXLSX();
    else if(a==='logout') cerrarSesion();
    else if(a==='config') abrirConfig();
    return;
  }

  // Fundido de salida al navegar hacia la bitácora
  const navLink = e.target.closest('a.nav-tab[href="bitacora.html"]');
  if(navLink && !e.metaKey && !e.ctrlKey && e.button === 0){
    e.preventDefault();
    document.body.classList.add('page-leaving');
    setTimeout(() => { window.location.href = navLink.getAttribute('href'); }, 250);
  }
});

document.addEventListener('keydown', (e) => {
  if(e.key === 'Enter' && (e.target.id === 'login-user' || e.target.id === 'login-pass')) hacerLogin();
});

window.addEventListener('storage', (e) => {
  if (e.key === 'vazse_auth') checkAuth();
  if (e.key === 'vazse_theme' && e.newValue && e.newValue !== state.theme) {
    document.documentElement.setAttribute('data-theme', e.newValue);
    state.theme = e.newValue;
    render();
  }
  if (e.key === 'vazse_cache_datos') render();
});

(function init(){
  let saved = null;
  try { saved = localStorage.getItem('vazse_theme'); } catch(e){}
  const sysDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  const theme = saved || (sysDark ? 'dark' : 'light');
  document.documentElement.setAttribute('data-theme', theme);
  state.theme = theme;
  render();
})();

// ── CONFIGURACIÓN DE EMPRESA ────────────────────────────────
const CFG_KEY = 'vazse_empresa_config';

function cargarConfig() {
  try {
    const c = JSON.parse(localStorage.getItem(CFG_KEY) || '{}');
    ['razon','rfc','regimen','cfdi','direccion','metodo-pago',
     'agente','patente','tel','aduana',
     'email-cobranza','email-ops','email-facturas','email-gerencia'].forEach(k => {
      const el = document.getElementById('cfg-' + k);
      if (el && c[k]) el.value = c[k];
    });
  } catch(e){}
}

function guardarConfig() {
  const c = {};
  ['razon','rfc','regimen','cfdi','direccion','metodo-pago',
   'agente','patente','tel','aduana',
   'email-cobranza','email-ops','email-facturas','email-gerencia'].forEach(k => {
    const el = document.getElementById('cfg-' + k);
    if (el) c[k] = el.value.trim();
  });
  try { localStorage.setItem(CFG_KEY, JSON.stringify(c)); } catch(e){}
  cerrarConfig();
  // Toast de confirmación
  const t = document.createElement('div');
  t.textContent = '✓ Configuración guardada';
  t.style.cssText = 'position:fixed;bottom:24px;right:24px;background:var(--pos);color:#fff;padding:10px 18px;border-radius:9px;font-size:13px;font-weight:500;z-index:999;animation:pageIn .3s ease';
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2800);
}

function abrirConfig() {
  cargarConfig();
  const ov = document.getElementById('cfg-overlay');
  ov.style.display = 'flex';
}

function cerrarConfig() {
  document.getElementById('cfg-overlay').style.display = 'none';
}

document.getElementById('cfg-overlay').addEventListener('click', function(e) {
  if (e.target === this) cerrarConfig();
});
</script>

<!-- ── MODAL CONFIGURACIÓN EMPRESA ─────────────────────────── -->

    </div>
    <div style="padding:14px 24px 18px;border-top:1px solid var(--bd);display:flex;justify-content:flex-end;gap:10px">
